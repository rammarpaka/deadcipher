name: Ingest RSS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "pipeline/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ingest.yml"

jobs:
  log-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Log RSS headlines (no scrape, no database)
        run: uv run python -m pipeline --no-scrape --max-items 12 --output artifacts/ingest.json
