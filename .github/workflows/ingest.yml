name: Ingest RSS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "pipeline/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ingest.yml"

concurrency:
  group: rss-ingest
  cancel-in-progress: false

jobs:
  ingest-rss:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      MAX_ITEMS: ${{ vars.MAX_ITEMS }}
      SYNTHESIS_MAX_CLUSTERS: ${{ vars.SYNTHESIS_MAX_CLUSTERS }}
      LATE_MERGE: ${{ vars.LATE_MERGE }}
      DAILY_BRIEF: ${{ vars.DAILY_BRIEF }}
      RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ingest RSS feeds (dedupe + scrape + export to Supabase)
        run: uv run python -m pipeline --output artifacts/ingest.json
