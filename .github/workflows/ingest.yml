name: Ingest RSS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "pipeline/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ingest.yml"

concurrency:
  group: rss-ingest
  cancel-in-progress: false

jobs:
  ingest-rss:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ingest RSS feeds (dedupe + scrape + export to Supabase)
        run: uv run python -m pipeline --max-items 12 --output artifacts/ingest.json
